<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klikk deg gjennom RStudio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #222; background: #fff; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .hint { font-size: .9rem; color: #555; margin: 0 0 8px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .btns button { font: inherit; font-size: .88rem; padding: 4px 10px 4px 6px; border: 1px solid #c3cad6; background: #fff; border-radius: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btns button:hover { background: #f3f5f8; }
  .btns button[aria-pressed="true"] { border-color: #333; box-shadow: 0 0 0 1px #333 inset; }
  .dot { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; color: #fff; font-size: .75rem; font-weight: 700; }
  svg { width: 100%; height: auto; display: block; border: 1px solid #c9ced6; border-radius: 6px; }
  .pane { cursor: pointer; transition: opacity .15s; }
  .pane:focus { outline: none; }
  .dim .pane { opacity: .3; }
  .dim .pane.on { opacity: 1; }
  .ring { fill: none; stroke-width: 4; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .on .ring { opacity: 1; }
  .pane:hover .ring { opacity: .55; }
  .on:hover .ring { opacity: 1; }
  svg text { white-space: pre; }
  .mono { font-family: Consolas, Monaco, "Courier New", monospace; }
  .info { margin-top: 10px; border-left: 5px solid #999; background: #f7f8fa; padding: 10px 14px; min-height: 128px; border-radius: 0 4px 4px 0; }
  .info h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .info p { margin: 0 0 6px; font-size: .95rem; line-height: 1.45; }
  .info p:last-child { margin-bottom: 0; }
  .info code { font-family: Consolas, Monaco, monospace; background: #eceff3; padding: 0 3px; border-radius: 3px; font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
  <p class="hint">Klikk på et av de fire vinduene (eller på knappene) for å se hva det brukes til.</p>
  <div class="btns" id="btns"></div>

  <svg id="rs" viewBox="0 0 900 540" role="group" aria-label="Skjematisk bilde av RStudio med fire vinduer">
    <!-- vindusramme -->
    <rect x="0" y="0" width="900" height="540" fill="#e9ecf0"/>
    <rect x="0" y="0" width="900" height="26" fill="#d6dae0"/>
    <circle cx="16" cy="13" r="5.5" fill="#ec6a5e"/><circle cx="34" cy="13" r="5.5" fill="#f4bf4f"/><circle cx="52" cy="13" r="5.5" fill="#61c554"/>
    <text x="450" y="17.5" text-anchor="middle" font-size="12" fill="#444">RStudio</text>
    <rect x="0" y="26" width="900" height="24" fill="#f3f4f6"/>
    <text x="12" y="42" font-size="11.5" fill="#666">File   Edit   Code   View   Plots   Session   Build   Debug   Profile   Tools   Help</text>

    <!-- 1 Script -->
    <g class="pane" data-p="1" tabindex="0" role="button" aria-label="1 Script">
      <rect x="6" y="56" width="440" height="236" fill="#fff" stroke="#c9ced6"/>
      <rect x="6" y="56" width="440" height="24" fill="#eef1f5" stroke="#c9ced6"/>
      <rect x="10" y="59" width="118" height="21" fill="#fff" stroke="#c9ced6"/>
      <text x="18" y="74" font-size="11.5" fill="#333">mitt_skript.R</text>
      <rect x="6" y="80" width="440" height="22" fill="#f7f8fa"/>
      <text x="380" y="95" font-size="11.5" fill="#1a7f37" font-weight="700">▶ Run</text>
      <g class="mono" font-size="12.5">
        <text x="14" y="122" fill="#999">1</text><text x="40" y="122" fill="#4a8a4a"># Mitt første R-skript</text>
        <text x="14" y="142" fill="#999">2</text>
        <text x="14" y="162" fill="#999">3</text><text x="40" y="162" fill="#4a8a4a"># Antall ord i seks nyhetsartikler</text>
        <text x="14" y="182" fill="#999">4</text><text x="40" y="182" fill="#222">antallord &lt;- c(340, 1329, 72, 259, 698, 567)</text>
        <text x="14" y="202" fill="#999">5</text>
        <text x="14" y="222" fill="#999">6</text><text x="40" y="222" fill="#222">mean(antallord)</text>
        <text x="14" y="242" fill="#999">7</text><text x="40" y="242" fill="#222">barplot(antallord)</text>
      </g>
      <rect class="ring" x="8" y="58" width="436" height="232" rx="3" stroke="#d62c2c"/>
      <circle cx="424" cy="270" r="13" fill="#d62c2c"/><text x="424" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    </g>

    <!-- 2 Environment -->
    <g class="pane" data-p="2" tabindex="0" role="button" aria-label="2 Environment">
      <rect x="452" y="56" width="442" height="236" fill="#fff" stroke="#c9ced6"/>
      <rect x="452" y="56" width="442" height="24" fill="#eef1f5" stroke="#c9ced6"/>
      <rect x="456" y="59" width="92" height="21" fill="#fff" stroke="#c9ced6"/>
      <text x="464" y="74" font-size="11.5" fill="#333">Environment</text>
      <text x="560" y="74" font-size="11.5" fill="#777">History   Connections</text>
      <text x="462" y="104" font-size="11.5" fill="#777">Global Environment</text>
      <rect x="452" y="112" width="442" height="20" fill="#f3f4f6"/>
      <text x="462" y="126" font-size="11.5" font-weight="700" fill="#555">Values</text>
      <g class="mono" font-size="12">
        <text x="462" y="152" fill="#222">antallord</text>
        <text x="570" y="152" fill="#444">num [1:6] 340 1329 72 259 698 567</text>
      </g>
      <rect class="ring" x="454" y="58" width="438" height="232" rx="3" stroke="#e07b28"/>
      <circle cx="872" cy="270" r="13" fill="#e07b28"/><text x="872" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    </g>

    <!-- 3 Console -->
    <g class="pane" data-p="3" tabindex="0" role="button" aria-label="3 Console">
      <rect x="6" y="298" width="440" height="236" fill="#fff" stroke="#c9ced6"/>
      <rect x="6" y="298" width="440" height="24" fill="#eef1f5" stroke="#c9ced6"/>
      <rect x="10" y="301" width="70" height="21" fill="#fff" stroke="#c9ced6"/>
      <text x="18" y="316" font-size="11.5" fill="#333">Console</text>
      <text x="92" y="316" font-size="11.5" fill="#777">Terminal   Background Jobs</text>
      <g class="mono" font-size="12.5">
        <text x="14" y="346" fill="#1f4e9c">&gt; antallord &lt;- c(340, 1329, 72, 259, 698, 567)</text>
        <text x="14" y="366" fill="#1f4e9c">&gt; mean(antallord)</text>
        <text x="14" y="386" fill="#222">[1] 544.1667</text>
        <text x="14" y="406" fill="#1f4e9c">&gt; barplot(antallord)</text>
        <text x="14" y="426" fill="#1f4e9c">&gt; <tspan fill="#222">▍</tspan></text>
      </g>
      <rect class="ring" x="8" y="300" width="436" height="232" rx="3" stroke="#1f6fb2"/>
      <circle cx="424" cy="512" r="13" fill="#1f6fb2"/><text x="424" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    </g>

    <!-- 4 Plots -->
    <g class="pane" data-p="4" tabindex="0" role="button" aria-label="4 Plots">
      <rect x="452" y="298" width="442" height="236" fill="#fff" stroke="#c9ced6"/>
      <rect x="452" y="298" width="442" height="24" fill="#eef1f5" stroke="#c9ced6"/>
      <text x="462" y="316" font-size="11.5" fill="#777">Files</text>
      <rect x="494" y="301" width="46" height="21" fill="#fff" stroke="#c9ced6"/>
      <text x="502" y="316" font-size="11.5" fill="#333">Plots</text>
      <text x="552" y="316" font-size="11.5" fill="#777">Packages   Help   Viewer</text>
      <!-- stolpediagram: 340, 1329, 72, 259, 698, 567 -->
      <g fill="#bdbdbd" stroke="#333" stroke-width="1">
        <rect x="560" y="467.0" width="30" height="33.0"/>
        <rect x="600" y="371.0" width="30" height="129.0"/>
        <rect x="640" y="493.0" width="30" height="7.0"/>
        <rect x="680" y="474.9" width="30" height="25.1"/>
        <rect x="720" y="432.2" width="30" height="67.8"/>
        <rect x="760" y="445.0" width="30" height="55.0"/>
      </g>
      <line x1="540" y1="500" x2="540" y2="371" stroke="#333"/>
      <g font-size="10" fill="#333" text-anchor="end">
        <text x="535" y="503">0</text><text x="535" y="455">500</text><text x="535" y="406">1000</text>
      </g>
      <line x1="537" y1="500" x2="540" y2="500" stroke="#333"/><line x1="537" y1="451.5" x2="540" y2="451.5" stroke="#333"/><line x1="537" y1="403" x2="540" y2="403" stroke="#333"/>
      <rect class="ring" x="454" y="300" width="438" height="232" rx="3" stroke="#3f8f3f"/>
      <circle cx="872" cy="512" r="13" fill="#3f8f3f"/><text x="872" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    </g>
  </svg>

  <div class="info" id="info" aria-live="polite"></div>
</div>

<script>
const P = {
  1: { name: "Script", color: "#d62c2c", html: `
    <p>Her skriver du koden din, omtrent som i et tekstdokument. Koden gjør ingenting før du <strong>kjører</strong> den: Sett markøren på en linje og trykk <strong>Run</strong>, eller <code>Cmd</code> + <code>Enter</code> (Mac) / <code>Ctrl</code> + <code>Enter</code> (Windows).</p>
    <p>Skriptet kan lagres som en fil (<code>.R</code>), slik at du kan kjøre alt på nytt senere. Linjer som starter med <code>#</code>, er kommentarer som R hopper over.</p>` },
  2: { name: "Environment", color: "#e07b28", html: `
    <p>Her ser du alt R husker akkurat nå: datasett, variabler og resultater som du har lagret med <code>&lt;-</code>. I eksempelet har R lagret <code>antallord</code>, som inneholder seks tall.</p>
    <p>Når du laster inn datasettet fra Medieundersøkelsen, dukker det opp her som <code>d</code>, med 1061 rader (obs.) og 16 variabler. Dukker ikke noe opp her etter at du har kjørt koden, har du sannsynligvis ikke lagret resultatet med <code>&lt;-</code>.</p>` },
  3: { name: "Console", color: "#1f6fb2", html: `
    <p>Her kjører R koden og viser svarene. Linjene som starter med <code>&gt;</code>, er koden som ble kjørt, og linjen under er resultatet. Her ser du for eksempel at gjennomsnittet av <code>antallord</code> er 544,17. Er noe galt i koden, kommer feilmeldingen også her.</p>
    <p>Står det <code>+</code> i stedet for <code>&gt;</code> nederst, venter R på resten av koden, ofte fordi en parentes mangler. Trykk <code>Esc</code> for å avbryte.</p>` },
  4: { name: "Plots", color: "#3f8f3f", html: `
    <p>Figurer du lager, dukker opp under fanen <strong>Plots</strong>, som stolpediagrammet i eksempelet. Med <strong>Export</strong> kan du lagre figuren som et bilde.</p>
    <p>Vinduet har flere faner. De viktigste ellers er <strong>Files</strong> (filene på maskinen din), <strong>Packages</strong> (pakkene du har installert) og <strong>Help</strong> (hjelpesider, for eksempel når du skriver <code>?mean</code>).</p>` }
};
const svg = document.getElementById("rs"), info = document.getElementById("info"), btns = document.getElementById("btns");
Object.entries(P).forEach(([k, v]) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.p = k; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<span class="dot" style="background:${v.color}">${k}</span>${v.name}`;
  b.addEventListener("click", () => select(k));
  btns.appendChild(b);
});
function select(k) {
  svg.classList.add("dim");
  svg.querySelectorAll(".pane").forEach(g => g.classList.toggle("on", g.dataset.p === k));
  btns.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === k ? "true" : "false"));
  const p = P[k];
  info.style.borderLeftColor = p.color;
  info.innerHTML = `<h3>${k}. ${p.name}</h3>` + p.html;
}
svg.querySelectorAll(".pane").forEach(g => {
  g.addEventListener("click", () => select(g.dataset.p));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(g.dataset.p); } });
});
info.innerHTML = `<h3>RStudio har fire vinduer</h3><p>Hvert vindu har sin egen jobb. Du skriver koden i <strong>Script</strong> (1), og resultatene havner i <strong>Console</strong> (3). Det R har lagret, ser du i <strong>Environment</strong> (2), og figurene dukker opp i <strong>Plots</strong> (4). Klikk på et vindu for å lese mer.</p>`;
const start = new URLSearchParams(location.search).get("vindu");
if (P[start]) select(start);
</script>
</body>
</html>
