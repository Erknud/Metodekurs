<style>
:root {
  --line: #c3cbd4; --tabbar: #e8edf2; --toolbar: #f6f8fa; --gap: #d5dce3;
  --blue: #1d43c4; --red: #c5060b; --muted: #6b7480; --sel: #dbe8f8;
  --mono: "Source Code Pro", Menlo, Consolas, Monaco, "Courier New", monospace;
  --ui: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--gap); color: #1f2328; font-family: var(--ui); font-size: 13px; overflow: hidden; }
button { font: inherit; }

/* top bar */
#top { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #f3f5f7; border-bottom: 1px solid var(--line); }
#top .logo { width: 20px; height: 20px; border-radius: 50%; background: #75aadb; color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
#top .title { font-weight: 600; }
#top .spacer { flex: 1; }
#status { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0a100; flex: none; }
#status.ready .dot { background: #2e9e4f; }
#status.error .dot { background: var(--red); }
#status.busy .dot { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#newtab { color: var(--blue); text-decoration: none; white-space: nowrap; }
#newtab:hover { text-decoration: underline; }

/* layout */
#ide { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; display: flex; padding: 5px; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#left { flex: 0 0 55%; }
#right { flex: 1 1 auto; }
.pane { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
#srcPane, #envPane { flex: 0 0 55%; }
#conPane, #brPane { flex: 1 1 auto; }
.gutter-v { flex: 0 0 6px; cursor: col-resize; }
.gutter-h { flex: 0 0 6px; cursor: row-resize; }
.gutter-v:hover, .gutter-h:hover { background: #c7d0da; }

/* tabs and toolbars */
.tabs { display: flex; align-items: flex-end; background: var(--tabbar); border-bottom: 1px solid var(--line); height: 28px; padding: 0 4px; gap: 2px; flex: none; overflow: hidden; }
.tab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 4px 10px; border-radius: 3px 3px 0 0; color: #3b434c; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 200px; }
.tab.active { background: #fff; border-color: var(--line); margin-bottom: -1px; color: #000; }
.tab .x { color: #8a939d; border-radius: 2px; padding: 0 3px; line-height: 1; }
.tab .x:hover { background: #e3e7eb; color: #000; }
.tabs .fill { flex: 1; }
.tb { display: flex; align-items: center; gap: 2px; padding: 2px 6px; background: var(--toolbar); border-bottom: 1px solid #e1e6eb; min-height: 28px; flex: none; flex-wrap: wrap; }
.tb .sep { width: 1px; height: 16px; background: #d0d6dc; margin: 0 4px; }
.tb .fill { flex: 1; }
.tb .label { color: var(--muted); padding: 0 4px; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent; background: transparent; padding: 2px 6px; border-radius: 3px; cursor: pointer; color: #2a3138; white-space: nowrap; }
.btn:hover:not(:disabled) { background: #e6ebf0; border-color: #d3dae1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn.run { color: #1a7f37; }
.btn.stop { color: var(--red); display: none; }
.body { flex: 1 1 auto; min-height: 0; position: relative; overflow: auto; }
.hidden { display: none !important; }
.empty { color: var(--muted); padding: 10px 12px; }

/* editor */
#editorWrap { position: absolute; inset: 0; }
.CodeMirror { height: 100%; font-family: var(--mono); font-size: 13px; line-height: 1.45; }
.CodeMirror-gutters { background: #f5f6f7; border-right: 1px solid #e6e9ec; }
.CodeMirror-linenumber { color: #9aa1a8; }
.CodeMirror-activeline-background { background: #f2f6fb; }
.cm-s-default .cm-keyword { color: #0000ff; }
.cm-s-default .cm-atom { color: #585cf6; }
.cm-s-default .cm-number { color: #0000cd; }
.cm-s-default .cm-string { color: #036a07; }
.cm-s-default .cm-comment { color: #4c886b; }
.cm-s-default .cm-builtin { color: #000; }
.cm-s-default .cm-variable, .cm-s-default .cm-variable-2 { color: #000; }
.cm-s-default .cm-operator, .cm-s-default .cm-arg-is { color: #687687; }
div.CodeMirror span.CodeMirror-matchingbracket { color: #000; background: #dbe6f2; outline: 1px solid #9fb3c8; }

/* data viewer */
#viewer { position: absolute; inset: 0; display: flex; flex-direction: column; }
#viewer .grid { flex: 1; overflow: auto; }
#viewer table { border-collapse: separate; border-spacing: 0; font-size: 12px; }
#viewer th, #viewer td { border-right: 1px solid #e3e7eb; border-bottom: 1px solid #e3e7eb; padding: 3px 8px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
#viewer th { position: sticky; top: 0; background: #f3f5f7; text-align: left; font-weight: 600; cursor: pointer; z-index: 1; }
#viewer th:hover { background: #e8ecf0; }
#viewer td.num { text-align: right; }
#viewer td.rn, #viewer th.rn { position: sticky; left: 0; background: #f7f8f9; color: var(--muted); text-align: right; }
#viewer th.rn { z-index: 2; cursor: default; }
#viewer td.na { color: #9aa1a8; font-style: italic; }
#viewer tr:hover td { background: #f2f6fb; }
#viewer .foot { flex: none; padding: 4px 8px; border-top: 1px solid #e1e6eb; color: var(--muted); background: var(--toolbar); }

/* console */
#console { position: absolute; inset: 0; overflow-y: auto; padding: 4px 8px 8px; font-family: var(--mono); font-size: 13px; line-height: 1.4; cursor: text; }
#conOut div { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.4em; }
#conOut .in { color: var(--blue); }
#conOut .err { color: var(--red); }
#conOut .note { color: var(--muted); }
.inrow { display: flex; align-items: flex-start; }
.prompt { color: var(--blue); width: 1.3em; flex: none; white-space: pre; }
#cin { flex: 1; border: 0; outline: none; resize: none; padding: 0; margin: 0; font: inherit; color: var(--blue); background: transparent; overflow: hidden; height: 1.4em; line-height: 1.4; }
#conPath { color: var(--muted); font-family: var(--mono); }
#busyNote { color: var(--muted); font-style: italic; }

/* environment */
.envhdr { display: flex; align-items: center; justify-content: space-between; background: #eef1f4; color: #39424b; font-weight: 600; padding: 3px 8px; border-bottom: 1px solid #e1e6eb; }
.envrow { display: grid; grid-template-columns: 16px minmax(60px, 32%) 1fr 22px; align-items: center; gap: 4px; padding: 3px 8px; border-bottom: 1px solid #f0f2f4; font-family: var(--mono); font-size: 12px; }
.envrow:hover { background: #f5f8fb; }
.envrow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.envrow .ds { color: #39424b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.envrow .tog { width: 14px; height: 14px; border-radius: 50%; background: #3d7fc3; color: #fff; font-size: 9px; display: grid; place-items: center; cursor: pointer; user-select: none; border: 0; padding: 0; }
.envrow .grid-ic { cursor: pointer; color: #3d7fc3; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.envdet { font-family: var(--mono); font-size: 12px; white-space: pre; color: #39424b; padding: 2px 8px 6px 36px; border-bottom: 1px solid #f0f2f4; overflow-x: auto; }
.envtop { font-family: var(--ui); }

/* history, files, packages */
.list { width: 100%; border-collapse: collapse; }
.list td, .list th { padding: 3px 8px; border-bottom: 1px solid #f0f2f4; text-align: left; white-space: nowrap; }
.list th { background: #f3f5f7; font-weight: 600; color: #39424b; position: sticky; top: 0; }
.list tr:hover td { background: #f5f8fb; }
.list .mono { font-family: var(--mono); font-size: 12px; }
.list .right { text-align: right; }
.hist div { font-family: var(--mono); font-size: 12px; padding: 2px 8px; white-space: pre; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-bottom: 1px solid #f4f5f6; }
.hist div:hover { background: #f5f8fb; }
.hist div.sel { background: var(--sel); }
a.lnk { color: var(--blue); text-decoration: none; cursor: pointer; }
a.lnk:hover { text-decoration: underline; }
.note-small { color: var(--muted); font-size: 12px; padding: 8px 10px; }
#pkgFilter { border: 1px solid #cfd6dd; border-radius: 3px; padding: 2px 6px; font: inherit; width: 140px; }

/* plots and help */
#plotBox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#plotBox canvas { max-width: 100%; max-height: 100%; }
#helpBody { padding: 10px 14px; font-size: 13px; line-height: 1.5; }
#helpBody h2 { font-size: 16px; margin: 8px 0; }
#helpBody h3 { font-size: 14px; margin: 14px 0 4px; }
#helpBody pre, #helpBody code { font-family: var(--mono); font-size: 12px; }
#helpBody pre { background: #f6f8fa; padding: 6px 8px; overflow-x: auto; }
#helpBody table { border-collapse: collapse; }
#helpBody td { vertical-align: top; padding: 2px 8px 2px 0; }

/* small screens: stack the panes */
@media (max-width: 820px) {
  html, body { overflow: auto; }
  #ide { position: static; display: block; padding: 5px; }
  #left, #right { display: block; }
  .gutter-v, .gutter-h { display: none; }
  .pane { margin-bottom: 6px; }
  #srcPane { height: 340px; } #conPane { height: 300px; }
  #envPane { height: 240px; } #brPane { height: 380px; }
  #newtab { display: none; }
}
</style>
</head>
<body>
<header id="top">
  <div class="logo">R</div>
  <div class="title">R Sandbox</div>
  <div class="spacer"></div>
  <div id="status"><span class="dot"></span><span id="statusText">Starting R…</span></div>
  <a id="newtab" target="_blank" rel="noopener" title="Open the sandbox in a new tab">Open in new tab ↗</a>
</header>

<main id="ide">
  <div class="col" id="left">
    <section class="pane" id="srcPane">
      <div class="tabs" id="srcTabs"></div>
      <div class="tb" id="srcToolbar">
        <button class="btn" id="bOpen" title="Open an R script from your computer"><svg viewBox="0 0 16 16"><path fill="#e2a53b" d="M1 3h5l1.5 1.5H15v9H1z"/></svg>Open</button>
        <button class="btn" id="bSave" title="Save the script to your computer (Ctrl/Cmd + S)"><svg viewBox="0 0 16 16"><path fill="#3d7fc3" d="M2 2h10l2 2v10H2z"/><path fill="#fff" d="M4 3h6v3H4zM4 9h8v4H4z"/></svg>Save</button>
        <button class="btn" id="bNew" title="Start a new, empty script"><svg viewBox="0 0 16 16"><path fill="#fff" stroke="#6b7480" d="M3.5 1.5h6l3 3v10h-9z"/><path fill="#2e9e4f" d="M10 8h1.5v2h2v1.5h-2v2H10v-2H8V10h2z"/></svg>New</button>
        <button class="btn hidden" id="bOrig" title="Load the original script again">↺ Original</button>
        <span class="fill"></span>
        <button class="btn run" id="bRun" title="Run the current line or selection (Ctrl/Cmd + Enter)"><svg viewBox="0 0 16 16"><path fill="#2e9e4f" d="M2 8h8V4l5 4.5-5 4.5V9H2z"/></svg>Run</button>
        <span class="sep"></span>
        <button class="btn" id="bSource" title="Source the whole script (Ctrl/Cmd + Shift + S). With echo: Ctrl/Cmd + Shift + Enter"><svg viewBox="0 0 16 16"><path fill="#3d7fc3" d="M2 2h8v3H2zM2 6.5h8v3H2zM2 11h8v3H2z"/><path fill="#2e9e4f" d="M11 4h1.5v6H15l-3 3.5L9 10h2z"/></svg>Source</button>
      </div>
      <div class="body" id="srcBody">
        <div id="editorWrap"></div>
        <div id="viewer" class="hidden"></div>
      </div>
      <input type="file" id="openFile" accept=".R,.r,.txt" class="hidden">
    </section>
    <div class="gutter-h" data-a="srcPane"></div>
    <section class="pane" id="conPane">
      <div class="tabs"><div class="tab active">Console</div><span class="fill"></span></div>
      <div class="tb">
        <span id="conPath">R · ~/</span>
        <span id="busyNote"></span>
        <span class="fill"></span>
        <button class="btn stop" id="bStop" title="Interrupt R"><svg viewBox="0 0 16 16"><path fill="#c5060b" d="M5 1h6l4 4v6l-4 4H5l-4-4V5z"/><path fill="#fff" d="M4.5 7h7v2h-7z"/></svg>Stop</button>
        <button class="btn" id="bClear" title="Clear console (Ctrl + L)"><svg viewBox="0 0 16 16"><path fill="#b07a3b" d="M10.5 1.5l1.5 1-3.5 5.5-1.5-1z"/><path fill="#d9a441" d="M3 8.5l4-1.5 2 1.5-1 6.5H2z"/></svg></button>
      </div>
      <div class="body">
        <div id="console">
          <div id="conOut"></div>
          <div class="inrow"><span class="prompt" id="prompt">&gt;</span><textarea id="cin" rows="1" spellcheck="false" autocomplete="off" aria-label="Console input"></textarea></div>
        </div>
      </div>
    </section>
  </div>
  <div class="gutter-v"></div>
  <div class="col" id="right">
    <section class="pane" id="envPane">
      <div class="tabs" data-group="tr">
        <div class="tab active" data-tab="env">Environment</div>
        <div class="tab" data-tab="hist">History</div>
        <span class="fill"></span>
      </div>
      <div class="tb" data-for="env">
        <button class="btn" id="bEnvClear" title="Remove all objects from the environment"><svg viewBox="0 0 16 16"><path fill="#b07a3b" d="M10.5 1.5l1.5 1-3.5 5.5-1.5-1z"/><path fill="#d9a441" d="M3 8.5l4-1.5 2 1.5-1 6.5H2z"/></svg></button>
        <span class="sep"></span>
        <span class="label">R ▾</span><span class="label">Global Environment ▾</span>
      </div>
      <div class="tb hidden" data-for="hist">
        <button class="btn" id="bHistCon" title="Send the selected command to the console">To Console</button>
        <button class="btn" id="bHistSrc" title="Insert the selected command into the script">To Source</button>
      </div>
      <div class="body" data-for="env" id="envBody"><div class="empty">Environment is empty</div></div>
      <div class="body hist hidden" data-for="hist" id="histBody"></div>
    </section>
    <div class="gutter-h" data-a="envPane"></div>
    <section class="pane" id="brPane">
      <div class="tabs" data-group="br">
        <div class="tab active" data-tab="files">Files</div>
        <div class="tab" data-tab="plots">Plots</div>
        <div class="tab" data-tab="pkgs">Packages</div>
        <div class="tab" data-tab="help">Help</div>
        <span class="fill"></span>
      </div>
      <div class="tb" data-for="files">
        <button class="btn" id="bUpload" title="Upload a file from your computer"><svg viewBox="0 0 16 16"><path fill="#3d7fc3" d="M8 1l4 4H9.5v5h-3V5H4z"/><path fill="#6b7480" d="M2 11h2v2h8v-2h2v4H2z"/></svg>Upload</button>
        <span class="fill"></span>
        <span class="label" id="filesPath">Home</span>
        <button class="btn" id="bFilesRefresh" title="Refresh">⟳</button>
      </div>
      <div class="tb hidden" data-for="plots">
        <button class="btn" id="pPrev" title="Previous plot" disabled>◀</button>
        <button class="btn" id="pNext" title="Next plot" disabled>▶</button>
        <span class="label" id="pCount"></span>
        <span class="sep"></span>
        <button class="btn" id="pExport" title="Save the plot as a PNG image" disabled><svg viewBox="0 0 16 16"><path fill="#3d7fc3" d="M8 15l-4-4h2.5V6h3v5H12z"/><path fill="#6b7480" d="M2 1h12v4h-2V3H4v2H2z"/></svg>Export</button>
        <button class="btn" id="pRemove" title="Remove the current plot" disabled>✕</button>

<script type="text/plain" id="rhelper">local({
  sb <- new.env()
  sb$urls <- list()
  sb$view <- NULL
  sb$help <- NULL

  # ---------- JSON (minimal) ----------
  esc <- function(s) {
    s <- enc2utf8(s)
    s <- gsub("\\", "\\\\", s, fixed = TRUE)
    s <- gsub("\"", "\\\"", s, fixed = TRUE)
    s <- gsub("\n", "\\n", s, fixed = TRUE)
    s <- gsub("\r", "\\r", s, fixed = TRUE)
    s <- gsub("\t", "\\t", s, fixed = TRUE)
    gsub("[\001-\037]", "", s, perl = TRUE)
  }
  json <- function(x) {
    if (is.null(x)) return("null")
    if (is.list(x)) {
      inner <- vapply(x, json, "")
      if (!is.null(names(x)))
        return(paste0("{", paste0("\"", esc(names(x)), "\":", inner, collapse = ","), "}"))
      return(paste0("[", paste(inner, collapse = ","), "]"))
    }
    if (is.factor(x)) x <- as.character(x)
    if (!length(x)) return("[]")
    if (is.character(x)) {
      v <- paste0("\"", esc(x), "\"")
      v[is.na(x)] <- "null"
    } else if (is.logical(x)) {
      v <- ifelse(x, "true", "false")
      v[is.na(x)] <- "null"
    } else {
      v <- as.character(x)
      v[is.na(x) | !is.finite(x)] <- "null"
    }
    paste0("[", paste(v, collapse = ","), "]")
  }

  # ---------- running code like the R console ----------
  fmt_cond <- function(cond, kind) {
    call <- conditionCall(cond)
    msg <- conditionMessage(cond)
    dc <- if (is.null(call)) "" else paste(deparse(call, nlines = 1), collapse = "")
    if (!nzchar(dc) || grepl("^(eval|withVisible|doTryCatch|tryCatch|withCallingHandlers)\\(", dc)) {
      if (kind == "Error") paste0("Error: ", msg) else paste0("Warning message:\n", msg)
    } else {
      if (kind == "Error") {
        sep <- if (nchar(dc) + nchar(msg) > 70) " : \n  " else " : "
        paste0("Error in ", dc, sep, msg)
      } else paste0("Warning message:\nIn ", dc, " : ", msg)
    }
  }
  echo <- function(lines, prompts) {
    if (length(lines)) cat(paste0("\001", prompts, lines), sep = "\n")
  }
  sb$run <- function(code, echo_code = TRUE, autoprint = TRUE, width = 80) {
    options(width = max(30, min(250, as.integer(width))))
    lines <- strsplit(code, "\n", fixed = TRUE)[[1]]
    exprs <- tryCatch(parse(text = code, keep.source = TRUE), error = function(e) e)
    if (inherits(exprs, "error")) {
      if (echo_code) {
        nb <- lines[nzchar(trimws(lines))]
        echo(nb, c("> ", rep("+ ", max(0, length(nb) - 1))))
      }
      m <- conditionMessage(exprs)
      first <- strsplit(m, "\n", fixed = TRUE)[[1]][1]
      what <- sub("^<text>:[0-9]+:[0-9]+: *", "", first)
      pos <- regmatches(first, regexec("^<text>:([0-9]+):([0-9]+)", first))[[1]]
      if (length(pos) == 3) {
        ln <- as.integer(pos[2]); cl <- as.integer(pos[3])
        snippet <- substr(lines[ln], 1, cl)
        message("Error: ", what, " in \"", trimws(snippet, "left"), "\"")
      } else message("Error: ", what)
      return(invisible())
    }
    srcs <- attr(exprs, "srcref")
    prev <- 0L
    for (i in seq_along(exprs)) {
      sr <- as.integer(srcs[[i]])
      fl <- sr[1]; ll <- sr[3]
      if (echo_code && ll > prev) {
        if (fl > prev + 1) {
          pre <- lines[(prev + 1):(fl - 1)]
          pre <- pre[nzchar(trimws(pre))]
          echo(pre, rep("> ", length(pre)))
        }
        body <- lines[max(fl, prev + 1):ll]
        echo(body, c("> ", rep("+ ", length(body) - 1)))
      }
      prev <- max(prev, ll)
      warns <- character(0)
      ok <- withCallingHandlers(
        tryCatch({
          res <- withVisible(eval(exprs[[i]], envir = globalenv()))
          if (autoprint && res$visible) print(res$value)
          TRUE
        },
        error = function(e) { message(fmt_cond(e, "Error")); FALSE },
        interrupt = function(e) { message(""); FALSE }),
        warning = function(w) {
          warns <<- c(warns, fmt_cond(w, "Warning"))
          invokeRestart("muffleWarning")
        })
      if (length(warns) == 1) message(warns)
      if (length(warns) > 1) message("Warning messages:\n",
        paste0(seq_along(warns), ": ", sub("^Warning message:\n", "", warns), collapse = "\n"))
      if (!ok) return(invisible())
    }
    if (echo_code && prev < length(lines)) {
      rest <- lines[(prev + 1):length(lines)]
      rest <- rest[nzchar(trimws(rest))]
      echo(rest, rep("> ", length(rest)))
    }
    invisible()
  }

  # ---------- state for the panes ----------
  env_info <- function() {
    nms <- ls(globalenv())
    lapply(nms, function(n) {
      x <- get(n, envir = globalenv())
      if (is.data.frame(x)) {
        str_lines <- tryCatch(utils::capture.output(utils::str(x, give.attr = FALSE, vec.len = 2,
                                                               list.len = 60))[-1],
                              error = function(e) character(0))
        list(name = n, kind = "data",
             desc = paste0(nrow(x), " obs. of ", ncol(x), " variable", if (ncol(x) == 1) "" else "s"),
             details = str_lines)
      } else if (is.function(x)) {
        a <- tryCatch(paste(deparse(args(x))[1], collapse = ""), error = function(e) "function")
        list(name = n, kind = "function", desc = sub(" *NULL$", "", a), details = character(0))
      } else {
        d <- if (is.atomic(x) && length(x) == 1 && is.null(dim(x)) && !is.factor(x)) {
          if (is.character(x)) paste0("\"", x, "\"") else format(x)
        } else {
          s <- tryCatch(utils::capture.output(utils::str(x, give.attr = FALSE, vec.len = 2))[1],
                        error = function(e) class(x)[1])
          s <- trimws(s)
          s
        }
        list(name = n, kind = "value", desc = d, details = character(0))
      }
    })
  }
  files_info <- function() {
    wd <- getwd()
    f <- list.files(wd, full.names = TRUE)
    f <- f[!basename(f) %in% c("default.profraw") & !(basename(f) == "Rplots.pdf" & file.size(f) == 0)]
    if (!length(f)) return(list(cwd = wd, files = list()))
    fi <- file.info(f)
    list(cwd = wd, files = lapply(seq_along(f), function(i)
      list(name = basename(f[i]), size = fi$size[i], dir = isTRUE(fi$isdir[i]),
           mtime = format(fi$mtime[i], "%b %d, %Y, %H:%M"))))
  }
  sb$state <- function(pkgs = FALSE) {
    out <- list(
      env = env_info(),
      files = files_info(),
      loaded = sub("^package:", "", grep("^package:", search(), value = TRUE)),
      view = sb$view,
      help = sb$help
    )
    sb$view <- NULL; sb$help <- NULL
    if (pkgs) {
      ip <- utils::installed.packages()
      ip <- ip[!duplicated(ip[, "Package"]), , drop = FALSE]
      out$pkgs <- list(name = unname(ip[, "Package"]), version = unname(ip[, "Version"]),
                       priority = unname(ifelse(is.na(ip[, "Priority"]), "", ip[, "Priority"])))
    }
    json(out)
  }
  sb$reg_url <- function(u, p) { sb$urls[[u]] <- p; invisible() }

  # ---------- tools that behave like RStudio ----------
  local_path <- function(x) {
    if (is.character(x) && length(x) == 1 && !is.na(x) && !is.null(sb$urls[[x]])) sb$urls[[x]] else x
  }
  tools <- new.env()
  tools$url <- function(description, open = "", ...) {
    p <- local_path(description)
    if (!identical(p, description)) gzfile(p, open = open) else base::url(description, open = open, ...)
  }
  tools$readRDS <- function(file, refhook = NULL) base::readRDS(local_path(file), refhook = refhook)
  tools$load <- function(file, envir = parent.frame(), ...) base::load(local_path(file), envir = envir, ...)
  tools$read.csv <- function(file, ...) utils::read.csv(local_path(file), ...)
  tools$read.csv2 <- function(file, ...) utils::read.csv2(local_path(file), ...)
  tools$read.table <- function(file, ...) utils::read.table(local_path(file), ...)
  tools$read.delim <- function(file, ...) utils::read.delim(local_path(file), ...)
  tools$readLines <- function(con = stdin(), ...) base::readLines(local_path(con), ...)
  tools$download.file <- function(url, destfile, ...) {
    p <- local_path(url)
    if (!identical(p, url)) { file.copy(p, destfile, overwrite = TRUE); return(invisible(0L)) }
    utils::download.file(url, destfile, ...)
  }
  tools$View <- function(x, title) {
    if (missing(title)) title <- paste(deparse(substitute(x))[1])
    df <- tryCatch(as.data.frame(x, stringsAsFactors = FALSE), error = function(e) NULL)
    if (is.null(df)) { message("View() can only show data frames, tables and vectors"); return(invisible()) }
    n <- nrow(df); show <- utils::head(df, 1000)
    cols <- lapply(show, function(col) {
      s <- if (is.numeric(col) && !is.integer(col)) format(col, digits = 7, trim = TRUE, drop0trailing = TRUE)
           else as.character(col)
      s[is.na(col)] <- NA
      s
    })
    sb$view <- list(title = title, names = names(df), nrow = n, ncol = ncol(df),
                    numeric = vapply(df, is.numeric, TRUE), cols = unname(cols))
    invisible()
  }
  show_help <- function(topic, package = NULL) {
    h <- tryCatch(do.call(utils::help, list(topic = topic, package = package, help_type = "text")),
                  error = function(e) NULL)
    paths <- if (is.null(h)) character(0) else as.character(h)
    html <- NULL
    if (length(paths)) {
      html <- tryCatch({
        rd <- utils:::.getHelpFile(paths[1])
        paste(utils::capture.output(tools::Rd2HTML(rd, out = "")), collapse = "\n")
      }, error = function(e) NULL)
    }
    sb$help <- list(topic = topic, html = html, found = length(paths) > 0)
    if (!length(paths)) message("No documentation for '", topic, "' in specified packages and libraries:\nyou could try '??", topic, "'")
    invisible()
  }
  tools$help <- function(topic, package = NULL, ...) {
    t <- substitute(topic)
    t <- if (is.character(t)) t else paste(deparse(t), collapse = "")
    show_help(t, package)
  }
  tools$`?` <- function(e1, e2) {
    t <- if (!missing(e2)) substitute(e2) else substitute(e1)
    t <- if (is.character(t)) t else paste(deparse(t), collapse = "")
    show_help(t)
  }
  tools$.sb <- sb
  env <- attach(NULL, name = "tools:rstudio")
  for (n in ls(tools, all.names = TRUE)) assign(n, get(n, envir = tools), envir = env)
})
</script>

<script type="module">
const params = new URLSearchParams(location.search);
const WEBR_BASE = params.get("webr") || "https://webr.r-wasm.org/latest/";
const PKGS = (params.get("pakker") ?? "dplyr,ggplot2,tidyverse,parameters,performance")
  .split(",").map(s => s.trim()).filter(Boolean);
const FIRST = ["dplyr", "ggplot2"];
const SCRIPT_URL = params.get("script");
const HOME = "/home/web_user";
const KEY = "rsandbox:" + (SCRIPT_URL || "default");

const START_SCRIPT = `# Velkommen til R-sandkassen
# Den fungerer som RStudio: sett markøren på en linje og trykk
# Ctrl + Enter (Windows) eller Cmd + Enter (Mac) for å kjøre den.

library(dplyr)

# Les inn kursdatasettet
d <- readRDS(url("https://raw.githubusercontent.com/Erknud/Metodekurs/main/mu26_mevi125.rds"))

head(d)
table(d$utvalg)
`;

const $ = id => document.getElementById(id);
const one = x => Array.isArray(x) ? x[0] : x;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage not available */ } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let webR = null, shelter = null, graphicsOK = true;

/* ---------------- status and top bar ---------------- */
function setStatus(text, cls) { $("status").className = cls || ""; $("statusText").textContent = text; }
let inIframe = true;
try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
if (inIframe) $("newtab").href = location.href; else $("newtab").classList.add("hidden");

/* ---------------- tabs in the right-hand panes ---------------- */
function selectTab(pane, name) {
  const p = $(pane);
  p.querySelectorAll(".tabs .tab[data-tab]").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  p.querySelectorAll("[data-for]").forEach(el => el.classList.toggle("hidden", el.dataset.for !== name));
}
document.querySelectorAll(".tabs[data-group] .tab").forEach(t =>
  t.addEventListener("click", () => selectTab(t.closest(".pane").id, t.dataset.tab)));

/* ---------------- console ---------------- */
const conOut = $("conOut"), cin = $("cin"), consoleEl = $("console");
function conWrite(text, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = String(text).replace(/\x1b\[[0-9;]*m/g, "");
  conOut.appendChild(div);
  if (conOut.childElementCount > 4000) for (let i = 0; i < 500; i++) conOut.firstChild.remove();
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function clearConsole() { conOut.innerHTML = ""; }
let charW = 7.8;
(function measure() {
  const c = document.createElement("canvas").getContext("2d");
  c.font = getComputedStyle(consoleEl).font || "13px monospace";
  charW = c.measureText("0123456789").width / 10 || 7.8;
})();
const conWidth = () => Math.max(40, Math.floor((consoleEl.clientWidth - 40) / charW));

function autosize() {
  cin.style.height = "auto";
  cin.style.height = cin.scrollHeight + "px";
  const n = cin.value.split("\n").length;
  $("prompt").textContent = [">"].concat(Array(n - 1).fill("+")).join("\n");
}
consoleEl.addEventListener("mouseup", () => {
  const s = window.getSelection();
  if (!s || s.isCollapsed) cin.focus();
});

/* ---------------- parsing helpers (to find whole expressions) ---------------- */
function analyse(str) {
  let d = 0, q = null;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (q) { if (c === "\\") i++; else if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === "`") q = c;
    else if (c === "#") { const nl = str.indexOf("\n", i); if (nl === -1) break; i = nl; }
    else if ("([{".includes(c)) d++;
    else if (")]}".includes(c)) d--;
  }
  return { depth: d, quote: q };
}
function continues(line) {
  const t = line.replace(/#[^"']*$/, "").trim();
  return /(\+|-|\*|\/|\^|,|\(|\||&|=|<-|%>%|%in%|\|>|~)$/.test(t);
}
function incomplete(code) {
  const a = analyse(code);
  const lines = code.replace(/\s+$/, "").split("\n");
  return a.depth > 0 || a.quote !== null || continues(lines[lines.length - 1]);
}

/* ---------------- task queue: R runs one thing at a time ---------------- */
const queue = [];
let running = false, readyResolve;
const ready = new Promise(r => { readyResolve = r; });
function enqueue(fn, label, front) {
  const t = { fn, label };
  if (front) queue.unshift(t); else queue.push(t);
  pump();
}
async function pump() {
  if (running) return;
  running = true;
  await ready;
  while (queue.length) {
    const t = queue.shift();
    setBusy(true, t.label);
    try { await t.fn(); } catch (e) { conWrite("Error: " + (e && e.message ? e.message : e), "err"); }
  }
  setBusy(false);
  running = false;
}
function setBusy(on, label) {
  $("bStop").style.display = on ? "inline-flex" : "none";
  $("busyNote").textContent = on && label ? label : "";
  $("status").classList.toggle("busy", on);
}

/* ---------------- running code ---------------- */
const urlCache = new Map();
async function prefetch(code) {
  const re = /["'](https?:\/\/[^"'\s]+)["']/g;
  const urls = new Set();
  let m;
  while ((m = re.exec(code))) urls.add(m[1]);
  for (const u of urls) {
    if (urlCache.has(u)) continue;
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      const buf = new Uint8Array(await r.arrayBuffer());
      const p = `${HOME}/.url_cache_${urlCache.size + 1}`;
      await webR.FS.writeFile(p, buf);
      await webR.evalRVoid(".sb$reg_url(u, p)", { env: { u, p } });
      urlCache.set(u, p);
    } catch (e) { /* let R try (and report the error) itself */ }
  }
}
function plotSize() {
  const p = $("brPane");
  return {
    width: Math.round(Math.min(1600, Math.max(320, p.clientWidth - 12))),
    height: Math.round(Math.min(1200, Math.max(240, p.clientHeight - 66))),
    bg: "white"
  };
}
function handleStdout(line) {
  if (line.includes("\f")) { clearConsole(); line = line.slice(line.lastIndexOf("\f") + 1); if (!line) return; }
  if (line.startsWith("\u0001")) conWrite(line.slice(1), "in");
  else conWrite(line);
}
async function execR(code, o = {}) {
  await prefetch(code);
  if (o.sourceLine) conWrite("> " + o.sourceLine, "in");
  const env = { code, echo_code: o.echo !== false, autoprint: o.autoprint !== false, width: conWidth() };
  const opts = { env, captureStreams: true, captureConditions: false };
  if (graphicsOK) opts.captureGraphics = plotSize();
  let res;
  try {
    res = await shelter.captureR(".sb$run(code, echo_code, autoprint, width)", opts);
  } catch (e) {
    conWrite(/interrupt/i.test(String(e && e.message)) ? "" : "Error: " + (e && e.message ? e.message : e), "err");
    await shelter.purge();
    await refreshState(false);
    return;
  }
  for (const out of res.output) {
    if (out.type === "stdout") handleStdout(out.data);
    else if (out.type === "stderr") conWrite(out.data, "err");
  }
  if (res.images && res.images.length) addPlots(res.images);
  await shelter.purge();
  await refreshState(/install\.packages|remove\.packages/.test(code));
}

const history = [];
let hIdx = null, hSaved = "";
function addHistory(code) {
  const c = code.replace(/\s+$/, "");
  if (!c.trim()) return;
  if (history[history.length - 1] !== c) history.push(c);
  renderHistory();
}
function submit(code, o = {}) {
  const lines = code.replace(/\s+$/, "").split("\n");
  if (lines.every(l => l.trim() === "" || l.trim().startsWith("#"))) {
    enqueue(async () => lines.filter(l => l.trim()).forEach(l => conWrite("> " + l, "in")), "");
    return;
  }
  addHistory(code);
  enqueue(() => execR(code, o), "");
}

/* console input */
cin.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const v = cin.value;
    if (v.trim() !== "" && incomplete(v)) {
      cin.setRangeText("\n", cin.selectionStart, cin.selectionEnd, "end");
      autosize();
      return;
    }
    cin.value = ""; autosize(); hIdx = null;
    if (v.trim() === "") { enqueue(async () => conWrite(">", "in"), ""); return; }
    submit(v);
  } else if (e.key === "ArrowUp" && cin.value.lastIndexOf("\n", cin.selectionStart - 1) === -1) {
    if (!history.length) return;
    e.preventDefault();
    if (hIdx === null) { hSaved = cin.value; hIdx = history.length; }
    if (hIdx > 0) { hIdx--; cin.value = history[hIdx]; autosize(); }
  } else if (e.key === "ArrowDown" && cin.value.indexOf("\n", cin.selectionStart) === -1 && hIdx !== null) {
    e.preventDefault();
    hIdx++;
    if (hIdx >= history.length) { cin.value = hSaved; hIdx = null; } else cin.value = history[hIdx];
    autosize();
  } else if (e.key === "Escape") {
    cin.value = ""; autosize(); hIdx = null;
  } else if (e.key === "Tab") {
    e.preventDefault(); cin.setRangeText("  ", cin.selectionStart, cin.selectionEnd, "end");
  }
});
cin.addEventListener("input", autosize);
$("bClear").addEventListener("click", () => { clearConsole(); cin.focus(); });
$("bStop").addEventListener("click", () => { if (webR) webR.interrupt(); });

/* ---------------- source pane: editor and data viewer ---------------- */
let scriptName = load(KEY + ":name") || "Untitled1";
const saved = load(KEY);
const cm = CodeMirror($("editorWrap"), {
  value: saved !== null ? saved : (SCRIPT_URL ? "" : START_SCRIPT),
  mode: "r", lineNumbers: true, matchBrackets: true, autoCloseBrackets: true,
  indentUnit: 2, tabSize: 2, indentWithTabs: false, smartIndent: true,
  extraKeys: {
    "Ctrl-Enter": () => runLine(), "Cmd-Enter": () => runLine(),
    "Shift-Ctrl-Enter": () => sourceScript(true), "Shift-Cmd-Enter": () => sourceScript(true),
    "Shift-Ctrl-S": () => sourceScript(false), "Shift-Cmd-S": () => sourceScript(false),
    "Ctrl-S": () => saveScript(), "Cmd-S": () => saveScript(),
    "Shift-Ctrl-C": c => c.toggleComment(), "Shift-Cmd-C": c => c.toggleComment(),
    "Alt--": c => c.replaceSelection(" <- "),
    "Shift-Ctrl-M": c => c.replaceSelection(" %>% "), "Shift-Cmd-M": c => c.replaceSelection(" %>% "),
    "Ctrl-L": () => clearConsole(),
    "Tab": c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("  ")
  }
});
let saveTimer = null;
cm.on("change", () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store(KEY, cm.getValue()), 400);
});
if (SCRIPT_URL) {
  $("bOrig").classList.remove("hidden");
  if (saved === null) loadOriginal(false);
}
async function loadOriginal(ask) {
  if (ask && !confirm("Replace the script with the original version?")) return;
  try {
    const r = await fetch(SCRIPT_URL);
    if (!r.ok) throw new Error(r.status);
    cm.setValue(await r.text());
    setScriptName(decodeURIComponent(SCRIPT_URL.split("/").pop()).replace(/\.[rR]$/, ""));
  } catch (e) { conWrite("Could not load the script: " + SCRIPT_URL, "err"); }
}

const views = [];
let activeSrc = "script";
function setScriptName(n) { scriptName = n || "Untitled1"; store(KEY + ":name", scriptName); renderSrcTabs(); }
const fileName = () => /\.[rR]$/.test(scriptName) ? scriptName : scriptName + ".R";
function renderSrcTabs() {
  const tabs = $("srcTabs");
  tabs.innerHTML = "";
  const mk = (id, title, closable) => {
    const t = document.createElement("div");
    t.className = "tab" + (activeSrc === id ? " active" : "");
    t.innerHTML = `<span>${esc(title)}</span>` + (closable ? '<span class="x" title="Close">×</span>' : "");
    t.addEventListener("click", ev => {
      if (ev.target.classList.contains("x")) { closeView(id); return; }
      showSrc(id);
    });
    tabs.appendChild(t);
  };
  mk("script", scriptName, false);
  views.forEach(v => mk(v.id, v.title, true));
  const f = document.createElement("span"); f.className = "fill"; tabs.appendChild(f);
}
function showSrc(id) {
  activeSrc = id;
  const isScript = id === "script";
  $("editorWrap").classList.toggle("hidden", !isScript);
  $("srcToolbar").classList.toggle("hidden", !isScript);
  $("viewer").classList.toggle("hidden", isScript);
  if (isScript) { cm.refresh(); cm.focus(); } else renderView(views.find(v => v.id === id));
  renderSrcTabs();
}
function closeView(id) {
  const i = views.findIndex(v => v.id === id);
  if (i >= 0) views.splice(i, 1);
  showSrc(activeSrc === id ? (views.length ? views[Math.max(0, i - 1)].id : "script") : activeSrc);
}
function openView(v) {
  const view = {
    id: "view:" + one(v.title), title: one(v.title), names: v.names || [], nrow: one(v.nrow), ncol: one(v.ncol),
    numeric: v.numeric || [], cols: v.cols || [], sort: null
  };
  const i = views.findIndex(x => x.id === view.id);
  if (i >= 0) views[i] = view; else views.push(view);
  showSrc(view.id);
}
function renderView(v) {
  const box = $("viewer");
  if (!v) { box.innerHTML = ""; return; }
  const n = v.cols.length ? v.cols[0].length : 0;
  let order = [...Array(n).keys()];
  if (v.sort) {
    const { j, dir } = v.sort, col = v.cols[j], num = v.numeric[j];
    order.sort((a, b) => {
      const x = col[a], y = col[b];
      if (x === null) return 1; if (y === null) return -1;
      const r = num ? parseFloat(x) - parseFloat(y) : String(x).localeCompare(String(y), "nb");
      return dir * r;
    });
  }
  let h = '<div class="grid"><table><thead><tr><th class="rn"></th>';
  v.names.forEach((nm, j) => {
    const arrow = v.sort && v.sort.j === j ? (v.sort.dir > 0 ? " ▲" : " ▼") : "";
    h += `<th data-j="${j}" title="Sort by ${esc(nm)}">${esc(nm)}${arrow}</th>`;
  });
  h += "</tr></thead><tbody>";
  for (const r of order) {
    h += `<tr><td class="rn">${r + 1}</td>`;
    for (let j = 0; j < v.cols.length; j++) {
      const val = v.cols[j][r];
      h += val === null ? '<td class="na">NA</td>' : `<td${v.numeric[j] ? ' class="num"' : ""}>${esc(val)}</td>`;
    }
    h += "</tr>";
  }
  h += `</tbody></table></div><div class="foot">Showing 1 to ${n} of ${v.nrow} entries, ${v.ncol} total columns</div>`;
  box.innerHTML = h;
  box.querySelectorAll("th[data-j]").forEach(th => th.addEventListener("click", () => {
    const j = +th.dataset.j;
    v.sort = v.sort && v.sort.j === j ? (v.sort.dir > 0 ? { j, dir: -1 } : null) : { j, dir: 1 };
    renderView(v);
  }));
}

/* run the current line (or the whole expression it belongs to) */
const lineAt = i => cm.getLine(i) ?? "";
function rangeText(a, b) { const out = []; for (let i = a; i <= b; i++) out.push(lineAt(i)); return out.join("\n"); }
function runLine() {
  if (cm.somethingSelected()) { submit(cm.getSelection()); return; }
  const last = cm.lastLine();
  const l = cm.getCursor().line;
  if (lineAt(l).trim() === "") {
    let n = l + 1; while (n <= last && lineAt(n).trim() === "") n++;
    cm.setCursor({ line: Math.min(n, last), ch: 0 });
    return;
  }
  let s = l, e = l;
  while (s > 0 && (analyse(rangeText(s, e)).depth < 0 || continues(lineAt(s - 1)))) s--;
  while (e < last) {
    const a = analyse(rangeText(s, e));
    if (a.depth > 0 || a.quote !== null || continues(lineAt(e))) e++; else break;
  }
  let n = e + 1; while (n <= last && lineAt(n).trim() === "") n++;
  if (n > last) n = last;
  cm.setCursor({ line: n, ch: n === e ? lineAt(n).length : 0 });
  cm.scrollIntoView(null, 60);
  submit(rangeText(s, e));
}
async function sourceScript(withEcho) {
  const code = cm.getValue();
  if (!code.trim()) return;
  const fname = fileName();
  addHistory(withEcho ? `source("~/${fname}", echo = TRUE)` : `source("~/${fname}")`);
  enqueue(async () => {
    await webR.FS.writeFile(`${HOME}/${fname}`, new TextEncoder().encode(code));
    if (withEcho) await execR(code, { sourceLine: `source("~/${fname}", echo = TRUE)` });
    else { await prefetch(code); await execR(`source("~/${fname}")`); }
  }, "");
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function saveScript() {
  if (/^Untitled\d*$/.test(scriptName)) {
    const n = prompt("Save script as:", "mitt_skript.R");
    if (!n) return;
    setScriptName(n.trim());
  }
  download(new Blob([cm.getValue()], { type: "text/plain" }), fileName());
}
$("bRun").addEventListener("click", () => { runLine(); cm.focus(); });
$("bSource").addEventListener("click", () => sourceScript(false));
$("bSave").addEventListener("click", saveScript);
$("bNew").addEventListener("click", () => {
  if (cm.getValue().trim() && !confirm("Start a new, empty script? The current script will be replaced.")) return;
  cm.setValue(""); setScriptName("Untitled1"); cm.focus();
});
$("bOrig").addEventListener("click", () => loadOriginal(true));
$("bOpen").addEventListener("click", () => $("openFile").click());
$("openFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  cm.setValue(await f.text()); setScriptName(f.name); showSrc("script");
  e.target.value = "";
});

/* ---------------- state from R: environment, files, packages, help ---------------- */
let loaded = new Set(), pkgList = null;
const expanded = new Set();
async function refreshState(pkgs) {
  let st;
  try { st = JSON.parse(await webR.evalRString(`.sb$state(${pkgs ? "TRUE" : "FALSE"})`)); }
  catch (e) { console.warn("state", e); return; }
  renderEnv(st.env || []);
  renderFiles(st.files);
  loaded = new Set(st.loaded || []);
  if (st.pkgs) pkgList = st.pkgs;
  renderPkgs();
  if (st.view) openView(st.view);
  if (st.help) showHelp(st.help);
}
const syntactic = n => /^([A-Za-z]|\.[A-Za-z._])[A-Za-z0-9._]*$/.test(n) ? n : "`" + n + "`";
function renderEnv(list) {
  const body = $("envBody");
  if (!list.length) { body.innerHTML = '<div class="empty">Environment is empty</div>'; return; }
  body.innerHTML = "";
  const groups = [["data", "Data"], ["value", "Values"], ["function", "Functions"]];
  for (const [kind, label] of groups) {
    const items = list.filter(x => one(x.kind) === kind);
    if (!items.length) continue;
    const hdr = document.createElement("div"); hdr.className = "envhdr"; hdr.textContent = label;
    body.appendChild(hdr);
    for (const it of items) {
      const name = one(it.name);
      const row = document.createElement("div"); row.className = "envrow";
      const isData = kind === "data";
      row.innerHTML = (isData ? `<button class="tog" title="Show the variables">${expanded.has(name) ? "▾" : "▸"}</button>` : "<span></span>") +
        `<span class="nm" title="${esc(name)}">${esc(name)}</span><span class="ds" title="${esc(one(it.desc))}">${esc(one(it.desc))}</span>` +
        (isData ? '<button class="grid-ic" title="View the data"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="#3d7fc3" d="M1 2h14v12H1z"/><path fill="#fff" d="M2 5h3.5v2.5H2zM6.5 5H10v2.5H6.5zM11 5h3v2.5h-3zM2 8.5h3.5V11H2zM6.5 8.5H10V11H6.5zM11 8.5h3V11h-3z"/></svg></button>' : "<span></span>");
      body.appendChild(row);
      if (isData) {
        const det = document.createElement("div");
        det.className = "envdet" + (expanded.has(name) ? "" : " hidden");
        det.textContent = (it.details || []).join("\n");
        body.appendChild(det);
        row.querySelector(".tog").addEventListener("click", ev => {
          if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
          det.classList.toggle("hidden");
          ev.target.textContent = expanded.has(name) ? "▾" : "▸";
        });
        row.querySelector(".grid-ic").addEventListener("click", () => submit(`View(${syntactic(name)})`));
        row.querySelector(".nm").addEventListener("click", () => submit(`View(${syntactic(name)})`));
        row.querySelector(".nm").style.cursor = "pointer";
      }
    }
  }
}
$("bEnvClear").addEventListener("click", () => {
  if (confirm("Remove all objects from the environment?")) submit("rm(list = ls())");
});

/* files */
let cwd = HOME;
const human = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
function renderFiles(f) {
  if (!f) return;
  cwd = one(f.cwd) || HOME;
  $("filesPath").textContent = cwd === HOME ? "Home" : cwd.replace(HOME, "~");
  $("conPath").textContent = "R · " + (cwd === HOME ? "~/" : cwd.replace(HOME, "~") + "/");
  const files = f.files || [];
  const body = $("filesBody");
  if (!files.length) {
    body.innerHTML = '<div class="empty">No files yet. Files you create with R (for example with write.csv2) or upload will appear here.</div>' + filesNote;
    return;
  }
  let h = '<table class="list"><thead><tr><th>Name</th><th class="right">Size</th><th>Modified</th><th></th></tr></thead><tbody>';
  files.forEach((x, i) => {
    const name = one(x.name), dir = one(x.dir);
    h += `<tr><td>${dir ? "📁 " : ""}<a class="lnk" data-i="${i}" data-act="${dir ? "" : "open"}">${esc(name)}</a></td>` +
      `<td class="right">${dir ? "" : human(one(x.size))}</td><td>${esc(one(x.mtime))}</td>` +
      `<td>${dir ? "" : `<a class="lnk" data-i="${i}" data-act="dl" title="Download to your computer">Download</a> &nbsp;<a class="lnk" data-i="${i}" data-act="rm" title="Delete">✕</a>`}</td></tr>`;
  });
  body.innerHTML = h + "</tbody></table>" + filesNote;
  body.querySelectorAll("a[data-act]").forEach(a => a.addEventListener("click", () => fileAction(one(files[+a.dataset.i].name), a.dataset.act)));
}
const filesNote = '<div class="note-small">Files are stored in your browser only while this page is open. Download the files you want to keep.</div>';
async function fileAction(name, act) {
  const path = `${cwd}/${name}`;
  if (act === "rm") {
    if (!confirm(`Delete ${name}?`)) return;
    enqueue(async () => { await webR.evalRVoid("invisible(file.remove(p))", { env: { p: path } }); await refreshState(false); }, "");
    return;
  }
  if (act === "open" && /\.[rR]$/.test(name)) {
    if (cm.getValue().trim() && !confirm(`Open ${name} in the script editor? The current script will be replaced.`)) return;
    const data = await webR.FS.readFile(path);
    cm.setValue(new TextDecoder().decode(data)); setScriptName(name); showSrc("script");
    return;
  }
  const data = await webR.FS.readFile(path);
  download(new Blob([data]), name);
}
$("bFilesRefresh").addEventListener("click", () => enqueue(() => refreshState(false), ""));
$("bUpload").addEventListener("click", () => $("uploadFile").click());
$("uploadFile").addEventListener("change", e => {
  const files = [...e.target.files];
  e.target.value = "";
  enqueue(async () => {
    for (const f of files) await webR.FS.writeFile(`${cwd}/${f.name}`, new Uint8Array(await f.arrayBuffer()));
    await refreshState(false);
  }, "");
  selectTab("brPane", "files");
});

/* plots */
const plots = [];
let pIdx = -1;
function addPlots(images) {
  for (const img of images) {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    c.getContext("2d").drawImage(img, 0, 0);
    plots.push(c);
  }
  if (plots.length > 50) plots.splice(0, plots.length - 50);
  pIdx = plots.length - 1;
  renderPlot();
  selectTab("brPane", "plots");
}
function renderPlot() {
  const box = $("plotBox");
  box.innerHTML = "";
  if (!plots.length) { box.innerHTML = '<div class="empty">Plots you make will appear here.</div>'; pIdx = -1; }
  else box.appendChild(plots[pIdx]);
  $("pCount").textContent = plots.length > 1 ? `${pIdx + 1} / ${plots.length}` : "";
  $("pPrev").disabled = pIdx <= 0;
  $("pNext").disabled = pIdx >= plots.length - 1;
  ["pExport", "pRemove", "pClear"].forEach(id => $(id).disabled = !plots.length);
}
$("pPrev").addEventListener("click", () => { pIdx--; renderPlot(); });
$("pNext").addEventListener("click", () => { pIdx++; renderPlot(); });
$("pExport").addEventListener("click", () => plots[pIdx].toBlob(b => download(b, "Rplot.png")));
$("pRemove").addEventListener("click", () => { plots.splice(pIdx, 1); pIdx = Math.min(pIdx, plots.length - 1); renderPlot(); });
$("pClear").addEventListener("click", () => { if (confirm("Remove all plots?")) { plots.length = 0; renderPlot(); } });

/* packages */
function renderPkgs() {
  const body = $("pkgsBody");
  if (!pkgList) return;
  const f = $("pkgFilter").value.trim().toLowerCase();
  const names = pkgList.name || [], vers = pkgList.version || [];
  const rows = names.map((n, i) => ({ n, v: vers[i] })).filter(x => x.n !== "base" && (!f || x.n.toLowerCase().includes(f)))
    .sort((a, b) => a.n.localeCompare(b.n));
  $("pkgNote").textContent = `${names.length} installed`;
  let h = '<table class="list"><thead><tr><th></th><th>Name</th><th>Version</th></tr></thead><tbody>';
  rows.forEach(x => {
    h += `<tr><td><input type="checkbox" data-p="${esc(x.n)}" ${loaded.has(x.n) ? "checked" : ""} title="Load / unload"></td><td class="mono">${esc(x.n)}</td><td class="mono">${esc(x.v)}</td></tr>`;
  });
  body.innerHTML = h + "</tbody></table>";
  body.querySelectorAll("input[data-p]").forEach(cb => cb.addEventListener("change", () => {
    const p = cb.dataset.p;
    submit(cb.checked ? `library(${p})` : `detach("package:${p}", unload = TRUE)`);
  }));
}
$("pkgFilter").addEventListener("input", renderPkgs);

/* help */
const helpStack = [];
function showHelp(h, fromBack) {
  const topic = one(h.topic), html = one(h.html), found = one(h.found);
  const body = $("helpBody");
  if (!fromBack) helpStack.push(h);
  $("hBack").disabled = helpStack.length < 2;
  $("helpTopic").textContent = topic;
  if (html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("script, link, style, meta").forEach(x => x.remove());
    body.innerHTML = doc.body.innerHTML;
    body.querySelectorAll("a[href]").forEach(a => a.addEventListener("click", ev => {
      const href = a.getAttribute("href");
      const m = href.match(/\/(?:help|html)\/([^/#?]+?)(?:\.html)?(?:[#?].*)?$/);
      ev.preventDefault();
      if (m && !/^https?:/.test(href)) {
        enqueue(() => execR(`help("${decodeURIComponent(m[1]).replace(/"/g, "")}")`, { echo: false, autoprint: false }), "");
      } else if (/^https?:/.test(href)) window.open(href, "_blank", "noopener");
    }));
  } else {
    const q = encodeURIComponent(topic);
    body.innerHTML = `<p>${found ? "The help page for" : "No documentation found for"} <code>${esc(topic)}</code>${found ? " could not be shown here." : " in the browser version of R."}</p>` +
      `<p>Search online: <a href="https://www.rdocumentation.org/search?q=${q}" target="_blank" rel="noopener">rdocumentation.org</a></p>`;
  }
  $("helpBodyWrap").scrollTop = 0;
  selectTab("brPane", "help");
}
$("hBack").addEventListener("click", () => {
  if (helpStack.length < 2) return;
  helpStack.pop();
  showHelp(helpStack[helpStack.length - 1], true);
});

/* history */
let histSel = -1;
function renderHistory() {
  const body = $("histBody");
  body.innerHTML = "";
  history.forEach((c, i) => {
    const d = document.createElement("div");
    d.textContent = c.split("\n").join(" ⏎ ");
    d.title = c;
    if (i === histSel) d.className = "sel";
    d.addEventListener("click", () => { histSel = i; renderHistory(); });
    d.addEventListener("dblclick", () => { cin.value = c; autosize(); cin.focus(); });
    body.appendChild(d);
  });
  body.scrollTop = body.scrollHeight;
}
$("bHistCon").addEventListener("click", () => { if (history[histSel] !== undefined) { cin.value = history[histSel]; autosize(); cin.focus(); } });
$("bHistSrc").addEventListener("click", () => {
  if (history[histSel] === undefined) return;
  showSrc("script"); cm.replaceSelection(history[histSel] + "\n"); cm.focus();
});

/* ---------------- resizable panes ---------------- */
function startDrag(e, g) {
  e.preventDefault();
  g.setPointerCapture(e.pointerId);
  const vertical = g.classList.contains("gutter-v");
  const move = ev => {
    if (vertical) {
      const r = $("ide").getBoundingClientRect();
      const pct = Math.min(80, Math.max(20, (ev.clientX - r.left) / r.width * 100));
      $("left").style.flexBasis = pct + "%";
    } else {
      const r = g.parentElement.getBoundingClientRect();
      const pct = Math.min(88, Math.max(12, (ev.clientY - r.top) / r.height * 100));
      $(g.dataset.a).style.flexBasis = pct + "%";
    }
  };
  const up = () => {
    g.removeEventListener("pointermove", move);
    g.removeEventListener("pointerup", up);
    cm.refresh();
  };
  g.addEventListener("pointermove", move);
  g.addEventListener("pointerup", up);
}
document.querySelectorAll(".gutter-v, .gutter-h").forEach(g => g.addEventListener("pointerdown", e => startDrag(e, g)));
window.addEventListener("resize", () => cm.refresh());

/* global shortcuts */
document.addEventListener("keydown", e => {
  if (e.defaultPrevented) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.ctrlKey && !e.shiftKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); clearConsole(); }
  else if (mod && e.key === "1") { e.preventDefault(); showSrc("script"); }
  else if (mod && e.key === "2") { e.preventDefault(); cin.focus(); }
  else if (mod && !e.shiftKey && (e.key === "s" || e.key === "S") && activeSrc === "script") { e.preventDefault(); saveScript(); }
});

/* ---------------- start R ---------------- */
renderSrcTabs();
renderPlot();
autosize();
(async () => {
  try {
    setStatus("Starting R…", "busy");
    const { WebR } = await import(WEBR_BASE + "webr.mjs");
    webR = new WebR({ baseUrl: WEBR_BASE });
    await webR.init();
    shelter = await new webR.Shelter();
    await webR.evalRVoid($("rhelper").textContent);
    try { await webR.evalRVoid("webr::shim_install()"); } catch (e) { console.warn(e); }
    try {
      await shelter.captureR("invisible(0)", { captureGraphics: { width: 50, height: 50 } });
    } catch (e) { graphicsOK = false; console.warn("No graphics", e); }
    await shelter.purge();
    const ver = await webR.evalRString("R.version.string");
    conWrite(ver);
    conWrite("Platform: wasm32-unknown-emscripten (webR, running in your browser)");
    conWrite("");
    conWrite("This sandbox works like RStudio. Files you create disappear when you close the page,", "note");
    conWrite("so download the files you want to keep (Files pane) and save your script.", "note");
    conWrite("");
    await refreshState(false);
    const first = PKGS.filter(p => FIRST.includes(p)), rest = PKGS.filter(p => !FIRST.includes(p));
    const install = (list, msg, done) => async () => {
      setStatus(msg, "busy");
      try { await webR.installPackages(list, { quiet: true }); }
      catch (e) { conWrite(`Could not install ${list.join(", ")}: ${e.message}`, "err"); }
      await refreshState(true);
      if (done) setStatus("R is ready", "ready");
    };
    if (first.length) enqueue(install(first, `Installing ${first.join(", ")} (can take a minute the first time)…`, true), "installing packages…", true);
    if (rest.length) enqueue(install(rest, `R is ready · installing ${rest.join(", ")} in the background…`), "installing packages…");
    enqueue(async () => { await refreshState(true); setStatus("R is ready", "ready"); }, "");
    readyResolve();
    if (!first.length && !rest.length) setStatus("R is ready", "ready");
    cm.focus();
  } catch (e) {
    setStatus("Could not start R: " + (e && e.message ? e.message : e) + ". Try reloading the page.", "error");
  }
})();

</script>
