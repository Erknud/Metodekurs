      draw(i, c); if (k === 1) rows[i].cur = {est: t.est, lo: t.lo, hi: t.hi};
    });
    if (k < 1) anim = requestAnimationFrame(step);
  }
  anim = requestAnimationFrame(step);
}
render(false);
</script>
</body>
