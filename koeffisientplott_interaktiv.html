,"est":0.0762,"lo":0.0502,"hi":0.1021,"p":1.196e-08},{"term":"kjonnKvinne","est":-0.0470,"lo":-0.1795,"hi":0.0855,"p":0.4867},{"term":"utdanningUniversitet/høyskole 1-4 år","est":0.0753,"lo":-0.0939,"hi":0.2446,"p":0.3826},{"term":"utdanningUniversitet/høyskole 5+ år","est":-0.0026,"lo":-0.1810,"hi":0.1759,"p":0.9773}]},"31":{"n":891,"r2":0.2029,"coef":[{"term":"alder","est":0.1367,"lo":0.0931,"hi":0.1803,"p":1.176e-09},{"term":"ki_bruk","est":0.2691,"lo":0.2271,"hi":0.3111,"p":1.765e-33},{"term":"venstre_hoyre","est":0.0604,"lo":0.0344,"hi":0.0863,"p":5.656e-06},{"term":"kjonnKvinne","est":-0.0578,"lo":-0.1876,"hi":0.0721,"p":0.3829},{"term":"utdanningUniversitet/høyskole 1-4 år","est":0.0794,"lo":-0.0865,"hi":0.2452,"p":0.3478},{"term":"utdanningUniversitet/høyskole 5+ år","est":0.0372,"lo":-0.1381,"hi":0.2125,"p":0.6772}]}};
const VARS = [
  {key: "alder", label: "Alder", bit: 1},
  {key: "ki_bruk", label: "KI-bruk", bit: 2},
  {key: "venstre_hoyre", label: "Venstre–høyre", bit: 4},
  {key: "kjonn", label: "Kjønn", bit: 8},
  {key: "utdanning", label: "Utdanning", bit: 16}
];
const ROWS = [
  {term: "alder", label: "Alder", v: "alder"},
  {term: "ki_bruk", label: "KI-bruk", v: "ki_bruk"},
  {term: "venstre_hoyre", label: "Venstre–høyre", v: "venstre_hoyre"},
  {term: "kjonnKvinne", label: "Kvinne", v: "kjonn"},
  {term: "utdanningUniversitet/høyskole 1-4 år", label: "Utdanning 1-4 år", v: "utdanning"},
  {term: "utdanningUniversitet/høyskole 5+ år", label: "Utdanning 5+ år", v: "utdanning"}
];
const W = 720, H = 330, M = {l: 140, r: 20, t: 10, b: 50};
const XMIN = -0.3, XMAX = 0.4;
const px = x => M.l + (x - XMIN) / (XMAX - XMIN) * (W - M.l - M.r);
const rowH = (H - M.t - M.b) / ROWS.length;
const ry = i => M.t + rowH * (i + 0.5);
const fmt = (v, d = 2) => v.toFixed(d).replace(".", ",").replace("-", "−");
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("plot");
function el(tag, a, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }

// ggplot-lignende bakgrunn
el("rect", {x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: "#ebebeb"});
for (let x = XMIN; x <= XMAX + 1e-9; x += 0.05) {
  const major = Math.abs(Math.round(x * 10) - x * 10) < 1e-6;
  el("line", {x1: px(x), x2: px(x), y1: M.t, y2: H - M.b, stroke: "#fff", "stroke-width": major ? 1.2 : 0.5});
  if (major) el("text", {x: px(x), y: H - M.b + 16, "text-anchor": "middle", "font-size": 12, fill: "#4d4d4d"}).textContent = fmt((Math.round(x * 10) / 10) || 0, 1);
}
ROWS.forEach((r, i) => el("line", {x1: M.l, x2: W - M.r, y1: ry(i), y2: ry(i), stroke: "#fff", "stroke-width": 1.2}));
el("line", {x1: px(0), x2: px(0), y1: M.t, y2: H - M.b, stroke: "#333", "stroke-dasharray": "5 4", "stroke-width": 1.2});
el("text", {x: (M.l + W - M.r) / 2, y: H - 10, "text-anchor": "middle", "font-size": 13, fill: "#222"}).textContent = "Effekt på syn på konsekvenser av KI (95 % konfidensintervall)";

const rows = ROWS.map((r, i) => {
  const lab = el("text", {x: M.l - 8, y: ry(i) + 4, "text-anchor": "end", "font-size": 13, fill: "#4d4d4d"}); lab.textContent = r.label;
  const ghostLine = el("line", {stroke: "#bdbdbd", "stroke-width": 2, opacity: 0});
  const ghostDot = el("circle", {r: 4.5, fill: "#bdbdbd", opacity: 0});
  const line = el("line", {stroke: "#000", "stroke-width": 2});
  const dot = el("circle", {r: 5.5, fill: "#000"});
  const val = el("text", {"font-size": 12, "text-anchor": "middle", fill: "#222", "font-weight": 600});
  const off = el("text", {x: px(-0.28), y: ry(i) + 4, "text-anchor": "start", "font-size": 12, fill: "#9a9a9a", "font-style": "italic"});
  off.textContent = "ikke med i modellen";
  return {lab, ghostLine, ghostDot, line, dot, val, off, cur: null};
});

let state = 31, prev = null, anim = null;
const varsEl = document.getElementById("vars");
VARS.forEach(v => {
  const lab = document.createElement("label"); lab.className = "chip on";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
  cb.addEventListener("change", () => {
    const next = cb.checked ? (state | v.bit) : (state & ~v.bit);
    lab.classList.toggle("on", cb.checked);
    prev = state; state = next; render(true);
  });
  lab.appendChild(cb); lab.appendChild(document.createTextNode(v.label)); varsEl.appendChild(lab);
});

function coefOf(k, term) { const m = MODELS[k]; return m && m.coef.find(c => c.term === term) || null; }

function draw(i, c) {
  const r = rows[i];
  if (!c) {
    [r.line, r.dot, r.val].forEach(e => e.setAttribute("opacity", 0));
    r.off.setAttribute("opacity", 1); r.lab.setAttribute("fill", "#b0b0b0");
    return;
  }
  [r.line, r.dot, r.val].forEach(e => e.setAttribute("opacity", 1));
  r.off.setAttribute("opacity", 0); r.lab.setAttribute("fill", "#4d4d4d");
  r.line.setAttribute("x1", px(c.lo)); r.line.setAttribute("x2", px(c.hi)); r.line.setAttribute("y1", ry(i)); r.line.setAttribute("y2", ry(i));
  r.dot.setAttribute("cx", px(c.est)); r.dot.setAttribute("cy", ry(i));
  r.val.setAttribute("x", px(c.est)); r.val.setAttribute("y", ry(i) - 10); r.val.textContent = fmt(c.est);
}

function render(animate) {
  const m = MODELS[state];
  const inc = VARS.filter(v => state & v.bit).map(v => v.key);
  document.getElementById("code").textContent = "lm(ki_konsekvenser ~ " + (inc.length ? inc.join(" + ") : "1") + ", data = d)";
  document.getElementById("fit").innerHTML = `R² = <b>${fmt(m.r2)}</b> &nbsp;·&nbsp; n = <b>${m.n}</b>` +
    (inc.length ? "" : " &nbsp;·&nbsp; Ingen forklaringsvariabler: modellen gjetter bare gjennomsnittet for alle");
  if (anim) cancelAnimationFrame(anim);
  const t0 = performance.now(), dur = animate ? 450 : 0;
  const targets = ROWS.map(r => coefOf(state, r.term));
  const starts = ROWS.map((r, i) => rows[i].cur);
  ROWS.forEach((r, i) => {
    const g = prev ? coefOf(prev, r.term) : null, t = targets[i], row = rows[i];
    const showGhost = g && t && Math.abs(g.est - t.est) > 0.005;
    row.ghostLine.setAttribute("opacity", showGhost ? 1 : 0); row.ghostDot.setAttribute("opacity", showGhost ? 1 : 0);
    if (showGhost) {
      row.ghostLine.setAttribute("x1", px(g.lo)); row.ghostLine.setAttribute("x2", px(g.hi)); row.ghostLine.setAttribute("y1", ry(i) + 7); row.ghostLine.setAttribute("y2", ry(i) + 7);
      row.ghostDot.setAttribute("cx", px(g.est)); row.ghostDot.setAttribute("cy", ry(i) + 7);
    }
  });
  function step(now) {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    ROWS.forEach((r, i) => {
      const s = starts[i], t = targets[i];
      if (!t) { draw(i, null); rows[i].cur = null; return; }
      const c = s ? {est: s.est + (t.est - s.est) * e, lo: s.lo + (t.lo - s.lo) * e, hi: s.hi + (t.hi - s.hi) * e} : t;
      draw(i, c); if (k === 1) rows[i].cur = {est: t.est, lo: t.lo, hi: t.hi};
    });
    if (k < 1) anim = requestAnimationFrame(step);
  }
  anim = requestAnimationFrame(step);
}
render(false);
</script>
